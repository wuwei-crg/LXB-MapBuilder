<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXB Map Builder v5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .header {
            background: #111827;
            padding: 15px 30px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header { display: none; }
        .header h1 {
            font-size: 20px;
            color: #93c5fd;
        }

        /* 两栏布局 (v5 优化) */
        .main-layout {
            display: grid;
            grid-template-columns: 420px 430px 1fr;
            gap: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* 左侧面板 - 配置+日志 */
        .left-panel {
            background: #0f172a;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .log-panel {
            background: #0f172a;
            border-right: 1px solid #334155;
            padding: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 右侧主面板 - 截图+节点 */
        .main-panel {
            background: #0b1220;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 卡片 */
        .card {
            background: #111827;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }
        .card h3 {
            font-size: 13px;
            color: #93c5fd;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card h3 > span:not(:first-child) {
            margin-left: auto;
        }
        .card h3::before {
            content: '';
            width: 3px;
            height: 14px;
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            border-radius: 2px;
        }

        /* 表单 */
        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block;
            margin-bottom: 3px;
            color: #94a3b8;
            font-size: 11px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0b1220;
            color: #e2e8f0;
            font-size: 12px;
            transition: all 0.2s;
        }
        .form-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .form-group select option {
            background: #0b1220;
            color: #e2e8f0;
            padding: 8px;
        }

        /* 按钮 */
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background: #475569;
            color: #fff;
        }
        .btn-success {
            background: #059669;
            color: #fff;
        }

        /* 状态指示器 */
        .status {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .status.success {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid #00d4aa;
            color: #00d4aa;
        }
        .status.error {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid #e94560;
            color: #e94560;
        }
        .status.warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            color: #ffc107;
        }

        /* 截图容器 */
        .screenshot-container {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .screenshot-container img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
        }
        .screenshot-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* 页面描述 */
        .page-description {
            background: linear-gradient(135deg, #1e1e38, #2a2a4a);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #00d4ff;
        }
        .page-description h4 {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .page-description p {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }

        /* UI 元素列表 */
        .ui-elements {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ui-element {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ui-element:hover {
            border-color: #00d4ff;
            background: #252542;
        }
        .ui-element.highlight {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }
        .ui-element-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .ui-element-type {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #3a3a5a;
            color: #aaa;
        }
        .ui-element-type.button { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }
        .ui-element-type.text { background: rgba(123, 104, 238, 0.2); color: #7b68ee; }
        .ui-element-type.icon { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .ui-element-type.input { background: rgba(0, 212, 170, 0.2); color: #00d4aa; }
        .ui-element-text {
            font-size: 13px;
            color: #fff;
            margin-bottom: 4px;
        }
        .ui-element-ocr {
            font-size: 11px;
            color: #888;
            font-style: italic;
        }
        .ui-element-bbox {
            font-size: 10px;
            color: #666;
            font-family: monospace;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #7b68ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        /* 页面列表 */
        .page-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        .page-item {
            background: #1a1a2e;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .page-item:hover {
            border-color: #00d4ff;
        }
        .page-item.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
        }
        .page-item-name {
            font-size: 13px;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .page-item-desc {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 日志 */
        .logs {
            background: #0a0a14;
            border-radius: 8px;
            padding: 12px;
            height: 100%;
            min-height: 360px;
            overflow-y: auto;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
        }
        .log-entry {
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .log-time { color: #666; margin-right: 8px; }
        .log-info { color: #00d4ff; }
        .log-debug { color: #aaa; }
        .log-warn { color: #ffc107; }
        .log-error { color: #e94560; }
        .log-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 10px;
            margin: 8px 0 10px;
            padding: 8px;
            background: #151529;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            font-size: 11px;
        }
        .log-filter-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #bbb;
            user-select: none;
            cursor: pointer;
        }
        .log-filter-item input {
            accent-color: #00d4ff;
        }

        /* 进度条 */
        .progress {
            height: 4px;
            background: #2a2a4a;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b68ee);
            transition: width 0.3s;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f0f1a; }
        ::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4a6a; }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #3a3a5a;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }
        .screenshot-panel {
            flex: 1 1 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .node-list-panel {
            width: 300px;
            min-width: 300px;
            margin-left: auto;
            background: #16162a;
            border-left: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
        }

        /* 标签 */
        .section-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: #0b1220;
            padding: 4px;
            border-radius: 8px;
        }
        .section-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .section-tab.active {
            background: #1e293b;
            color: #e2e8f0;
        }
        .section-tab:hover:not(.active) {
            background: #172554;
        }
    </style>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</head>
<body>
    <div class="header">
        <h1>LXB Map Builder</h1>
        <div style="display: flex; gap: 12px; align-items: center;">
            <select id="explore-version" style="padding: 6px 12px; background: #0b1220; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 12px;">
                <option value="node" selected>v5 Node驱动 (推荐)</option>
                <option value="coord">v4 坐标驱动</option>
                <option value="som">v3 SoM 标注</option>
                <option value="v3">v3 语义探索</option>
                <option value="v2">v2 VLM+XML</option>
            </select>
            <span id="connection-status" class="status" style="margin: 0; padding: 6px 12px;">
                <span class="loading"></span> 连接中...
            </span>
        </div>
    </div>

    <div class="main-layout">
        <!-- 左侧面板 - 配置+日志 -->
        <div class="left-panel">
            <!-- 统一配置面板 -->
            <div class="card">
                <h3>⚙️ 配置</h3>

                <!-- 应用选择 + 队列 -->
                <div class="form-group">
                    <label>选择应用</label>
                    <div style="display: flex; gap: 6px;">
                        <select id="app-select" style="flex: 1;" multiple size="8" onchange="onAppSelect()"></select>
                        <button class="btn btn-secondary" onclick="refreshAppList()" title="刷新" style="padding: 6px 10px;">🔄</button>
                    </div>
                    <div style="margin-top: 6px; display: flex; gap: 6px;">
                        <button class="btn btn-secondary" style="padding: 6px 10px; flex: 1;" onclick="addSelectedAppsToQueue()">+ 添加所选</button>
                        <button class="btn btn-secondary" style="padding: 6px 10px; flex: 1;" onclick="clearPackageQueue()">清空队列</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>包名</label>
                    <input type="text" id="package-name" placeholder="com.example.app">
                    <div style="margin-top: 6px;">
                        <button class="btn btn-secondary" style="padding: 6px 10px; width: 100%;" onclick="addTypedPackageToQueue()">+ 添加手输包名</button>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label>包名队列 (<span id="queue-count">0</span>)</label>
                    <div id="package-queue" style="max-height: 120px; overflow-y: auto; border: 1px solid #334155; border-radius: 6px; padding: 6px; background: #0b1220;">
                        <div style="font-size: 11px; color: #64748b;">队列为空</div>
                    </div>
                    <div id="queue-runtime" style="margin-top: 6px; font-size: 11px; color: #64748b;">
                        队列空闲
                    </div>
                </div>

                <!-- 探索参数 -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div class="form-group" style="margin: 0;">
                        <label>最大页面</label>
                        <input type="number" id="max-pages" value="30" min="1" max="100">
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label>最大深度</label>
                        <input type="number" id="max-depth" value="5" min="1" max="20">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                    <div class="form-group" style="margin: 0;">
                        <label>探索模式</label>
                        <select id="explore-mode">
                            <option value="serial">串行 (稳定)</option>
                            <option value="parallel">并行 (快速)</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label>点击延迟(秒)</label>
                        <input type="number" id="click-delay" value="1.5" min="0.5" max="5" step="0.5">
                    </div>
                </div>

                <!-- VLM 配置 (可折叠) -->
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a4a;">
                    <div onclick="toggleVLMConfig()" style="cursor: pointer; display: flex; align-items: center; margin-bottom: 8px;">
                        <span style="font-size: 11px; color: #888;">VLM 配置</span>
                        <span id="vlm-toggle" style="margin-left: 6px; font-size: 10px; color: #666;">▼</span>
                        <span id="config-badge" style="margin-left: auto; font-size: 9px; background: #3a3a5a; padding: 2px 5px; border-radius: 3px; display: none;">已保存</span>
                    </div>
                    <div id="vlm-config-content">
                        <div class="form-group">
                            <label>API URL</label>
                            <input type="text" id="vlm-api-url" placeholder="https://api.example.com/v1">
                        </div>
                        <div class="form-group">
                            <label>API Key</label>
                            <input type="password" id="vlm-api-key" placeholder="sk-xxx">
                        </div>
                        <div class="form-group">
                            <label>模型</label>
                            <input type="text" id="vlm-model-name" value="qwen-vl-plus">
                        </div>
                        <div style="display: flex; align-items: center; margin: 8px 0;">
                            <input type="checkbox" id="vlm-concurrent-enabled" style="margin-right: 6px;">
                            <label for="vlm-concurrent-enabled" style="margin: 0; cursor: pointer; font-size: 11px;">并发推理</label>
                        </div>
                        <div id="concurrent-config" style="display: none;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                                <div class="form-group" style="margin: 0;">
                                    <label>并发数</label>
                                    <input type="number" id="vlm-concurrent-requests" value="5" min="1" max="10">
                                </div>
                                <div class="form-group" style="margin: 0;">
                                    <label>阈值</label>
                                    <input type="number" id="vlm-occurrence-threshold" value="2" min="1" max="10">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div style="display: flex; gap: 6px; margin-top: 12px;">
                    <button class="btn btn-secondary" style="padding: 6px 10px;" onclick="testVLMApi()" title="测试 VLM API">🧪</button>
                    <button class="btn btn-secondary" style="padding: 6px 10px;" onclick="saveAllConfig()" title="保存配置">💾</button>
                    <button class="btn btn-success" id="btn-start" style="flex: 1;" onclick="startExploration()">▶ 开始探索</button>
                    <button class="btn btn-secondary hidden" id="btn-pause" onclick="pauseExploration()">⏸</button>
                    <button class="btn btn-secondary hidden" id="btn-resume" onclick="resumeExploration()">▶</button>
                    <button class="btn btn-secondary hidden" id="btn-stop" style="background: #e94560; color: #fff;" onclick="stopExploration()">⏹</button>
                </div>
            </div>

            <!-- 探索日志 -->
            
        </div>

        <div class="log-panel">
<div class="card" style="flex: 1; display: flex; flex-direction: column; min-height: 150px;">
                <h3>📝 日志</h3>
                <div class="progress">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="log-filter-bar">
                    <label class="log-filter-item"><input type="checkbox" id="f-find" checked>find_node</label>
                    <label class="log-filter-item"><input type="checkbox" id="f-tap" checked>tap</label>
                    <label class="log-filter-item"><input type="checkbox" id="f-warn" checked>warn</label>
                    <label class="log-filter-item"><input type="checkbox" id="f-error" checked>error</label>
                    <label class="log-filter-item"><input type="checkbox" id="f-popup">popup</label>
                    <label class="log-filter-item"><input type="checkbox" id="f-route">route</label>
                    <label class="log-filter-item"><input type="checkbox" id="f-vlm">vlm</label>
                    <label class="log-filter-item"><input type="checkbox" id="f-other">other</label>
                </div>
                <div class="logs" id="logs" style="flex: 1;"></div>
            </div>
        </div>

        <!-- 右侧主面板 -->
        <div class="main-panel">
            <!-- 顶部状态栏 -->
            <div style="padding: 12px 16px; background: #16162a; border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; gap: 12px;">
                <span id="explore-status-badge" style="padding: 4px 10px; background: #2a2a4a; border-radius: 4px; font-size: 11px;">⏳ 空闲</span>
                <span id="explore-stats-inline" style="font-size: 11px; color: #888;">节点: 0 | 动作: 0</span>
                <span style="flex: 1;"></span>
                <span id="connection-status-mini" style="font-size: 10px; color: #666;">-</span>
            </div>

            <!-- 主内容区：截图 + 节点列表 -->
            <div style="flex: 1; display: flex; overflow: hidden;">
                <!-- 左侧：实时截图 -->
                <div class="screenshot-panel">
                    <div id="screenshot-container" style="flex: 1; display: flex; align-items: center; justify-content: center; background: #0f0f1a; border-radius: 10px; overflow: hidden;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📱</div>
                            <p>等待探索开始...</p>
                        </div>
                    </div>
                    <div id="current-action-info" style="margin-top: 8px; font-size: 11px; color: #666; text-align: center;">-</div>
                </div>

                <!-- 右侧：节点列表 -->
                <div class="node-list-panel">
                    <div style="padding: 12px 14px; border-bottom: 1px solid #2a2a4a;">
                        <div style="font-size: 12px; font-weight: 500; color: #00d4ff;">🎯 节点列表</div>
                    </div>
                    <div id="node-list-container" style="flex: 1; overflow-y: auto; padding: 10px;">
                        <div class="empty-state" style="padding: 30px 15px;">
                            <div class="empty-state-icon" style="font-size: 36px;">📋</div>
                            <p style="font-size: 11px;">开始探索后显示节点</p>
                        </div>
                    </div>
                    <div style="padding: 10px; border-top: 1px solid #2a2a4a;">
                        <button class="btn btn-secondary" style="width: 100%; padding: 8px;" onclick="saveResult()">💾 保存结果</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        // ========== 应用列表 + 队列 ==========
        let appList = [];

        // 刷新应用列表
        async function refreshAppList() {
            const select = document.getElementById('app-select');
            select.innerHTML = '';
            select.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/command/list_apps`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filter: 'user' })
                });
                const data = await res.json();

                if (data.success && data.response && Array.isArray(data.response.apps)) {
                    appList = data.response.apps.slice();

                    // 优先按可读名称排序，再按包名排序
                    appList.sort((a, b) => {
                        const an = (a.name || a.label || a.package || '').toLowerCase();
                        const bn = (b.name || b.label || b.package || '').toLowerCase();
                        if (an !== bn) return an.localeCompare(bn);
                        return (a.package || '').localeCompare(b.package || '');
                    });

                    // 构建选项
                    appList.forEach(app => {
                        const option = document.createElement('option');
                        option.value = app.package;
                        const label = (app.label || app.name || '').trim();
                        const hasLabel = !!label && (app.name_source !== 'inferred');
                        if (hasLabel) {
                            option.textContent = `${label} (${app.package})`;
                            option.title = `${label}\n${app.package}`;
                        } else {
                            option.textContent = `${app.package} [no-label]`;
                            option.title = app.package;
                        }
                        select.appendChild(option);
                    });

                    addLog('info', tr('mb.user_apps_count', 'Found {count} user apps', { count: appList.length }));
                } else {
                    addLog('error', data.message || tr('mb.fetch_apps_failed', 'Failed to fetch app list'));
                }
            } catch (e) {
                addLog('error', tr('mb.fetch_apps_failed_with_msg', 'Failed to fetch app list: {msg}', { msg: e.message }));
            }

            select.disabled = false;
        }

        function addPackageToQueue(pkg) {
            const value = String(pkg || '').trim();
            if (!value) return;
            if (packageQueue.includes(value)) return;
            packageQueue.push(value);
            renderPackageQueue();
            renderQueueRuntime();
        }

        function addSelectedAppsToQueue() {
            const select = document.getElementById('app-select');
            if (!select || !select.selectedOptions || select.selectedOptions.length === 0) {
                addLog('warn', tr('mb.pick_apps_first', 'Please select app(s) first'));
                return;
            }
            for (const opt of select.selectedOptions) {
                addPackageToQueue(opt.value);
            }
            addLog('info', tr('mb.queue_size', 'Queue size: {count}', { count: packageQueue.length }));
        }

        function addTypedPackageToQueue() {
            const input = document.getElementById('package-name');
            const pkg = String(input.value || '').trim();
            if (!pkg) {
                addLog('warn', tr('mb.enter_package_first', 'Please enter package name first'));
                return;
            }
            addPackageToQueue(pkg);
            addLog('info', tr('mb.added_package', 'Added: {pkg}', { pkg }));
        }

        function removePackageFromQueue(index) {
            if (index < 0 || index >= packageQueue.length) return;
            const removed = packageQueue.splice(index, 1);
            renderPackageQueue();
            renderQueueRuntime();
            if (removed.length > 0) {
                addLog('info', tr('mb.removed_package', 'Removed: {pkg}', { pkg: removed[0] }));
            }
        }

        function clearPackageQueue() {
            packageQueue = [];
            renderPackageQueue();
            renderQueueRuntime();

        function renderPackageQueue() {
            const container = document.getElementById('package-queue');
            const countEl = document.getElementById('queue-count');
            if (!container || !countEl) return;
            countEl.textContent = String(packageQueue.length);

            if (packageQueue.length === 0) {
                container.innerHTML = `<div style="font-size: 11px; color: #64748b;">${tr('mb.queue_empty', 'Queue is empty')}</div>`;
                return;
            }

            container.innerHTML = packageQueue.map((pkg, idx) => `
                <div style="display:flex;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid #1e293b;">
                    <span style="font-size:11px;color:#cbd5e1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${pkg}</span>
                    <button class="btn btn-secondary" style="padding:2px 6px;font-size:11px;" onclick="removePackageFromQueue(${idx})">x</button>

            `).join('');
        }

        function setRunUi(running, mode = '') {
            const btnStart = document.getElementById('btn-start');
            const btnPause = document.getElementById('btn-pause');
            const btnResume = document.getElementById('btn-resume');
            const btnStop = document.getElementById('btn-stop');
            if (!btnStart || !btnPause || !btnResume || !btnStop) return;

            if (!running) {
                btnStart.classList.remove('hidden');
                btnPause.classList.add('hidden');
                btnResume.classList.add('hidden');
                btnStop.classList.add('hidden');
                return;
            }

            btnStart.classList.add('hidden');
            btnStop.classList.remove('hidden');
            if (mode === 'queue') {
                btnPause.classList.add('hidden');
                btnResume.classList.add('hidden');
            } else {
                btnPause.classList.remove('hidden');
                btnResume.classList.add('hidden');
            }
        }

        function renderQueueRuntime(queue) {
            const el = document.getElementById('queue-runtime');
            if (!el) return;

            const q = queue || {};
            const pending = Array.isArray(q.pending) ? q.pending.length : 0;
            const completed = Array.isArray(q.completed) ? q.completed.length : 0;
            const failed = Array.isArray(q.failed) ? q.failed.length : 0;
            const current = q.current && q.current.package ? q.current.package : '-';

            if (!q.running && !runActive) {
                el.textContent = tr('mb.queue_idle', 'Queue idle');
                return;
            }

            const status = q.running ? tr('mb.running', 'Running') : tr('mb.stopped', 'Stopped');
            el.textContent = tr('mb.queue_runtime', 'Queue {status} | Current: {current} | Pending: {pending} | Success: {completed} | Failed: {failed}', {
                status,
                current,
                pending,
                completed,
                failed
            });
        }

        // 绘制检测框 - 接收像素坐标
        function drawBBoxes(nodes, imageWidth, imageHeight) {
            const canvas = document.getElementById('screenshot-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const img = document.getElementById('screenshot-img');

            // 计算缩放比例（图片可能被缩放显示）
            const scaleX = img.width / imageWidth;
            const scaleY = img.height / imageHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 颜色映射
            const colors = {
                button: '#00d4ff',
                icon: '#ffc107',
                text: '#7b68ee',
                input: '#00d4aa',
                image: '#ff6b6b',
                default: '#00d4ff'
            };

            nodes.forEach((node, idx) => {
                const [x1, y1, x2, y2] = node.bounds;
                const color = colors[node.vlm_label?.toLowerCase()] || colors.default;

                // 绘制边框
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.strokeRect(
                    x1 * scaleX,
                    y1 * scaleY,
                    (x2 - x1) * scaleX,
                    (y2 - y1) * scaleY
                );

                // 绘制序号标签
                const labelWidth = 24;
                const labelHeight = 18;
                ctx.fillStyle = color;
                ctx.fillRect(x1 * scaleX, y1 * scaleY - labelHeight, labelWidth, labelHeight);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(idx + 1, x1 * scaleX + labelWidth / 2, y1 * scaleY - 5);
            });
        }

        // 截图并分析

            addLog('info', tr('mb.capture_and_analyze', 'Capturing and analyzing...'));

        // 绘制 VLM 原始检测框（像素坐标）
        function drawVLMBBoxes(vlmRaw, imageWidth, imageHeight) {
            const canvas = document.getElementById('screenshot-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const img = document.getElementById('screenshot-img');
            const scaleX = img.width / imageWidth;
            const scaleY = img.height / imageHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            vlmRaw.forEach((det, idx) => {
                const [x1, y1, x2, y2] = det.bbox;

                // 绘制边框 - 红色表示未匹配
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 2;
                ctx.strokeRect(
                    x1 * scaleX,
                    y1 * scaleY,
                    (x2 - x1) * scaleX,
                    (y2 - y1) * scaleY
                );

                // 绘制序号
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(x1 * scaleX, y1 * scaleY - 16, 20, 16);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(idx + 1, x1 * scaleX + 10, y1 * scaleY - 4);
            });

            addLog('info', tr('mb.draw_vlm_boxes', 'Drew {count} VLM boxes', { count: vlmRaw.length }));
        }

        // 获取元素类型
        function getElementType(node) {
            if (node.editable) return 'input';
            if (node.vlm_label) {
                const label = node.vlm_label.toLowerCase();
                if (label.includes('button')) return 'button';
                if (label.includes('icon')) return 'icon';
                if (label.includes('text')) return 'text';
            }
            if (node.clickable) return 'button';
            if (node.text) return 'text';
            return 'element';
        }

        // 获取元素CSS类
        function getElementClass(node) {
            const type = getElementType(node);
            return ['button', 'text', 'icon', 'input'].includes(type) ? type : '';
        }

        // 获取元素文本
        function getElementText(node) {
            if (node.text) return node.text;
            if (node.resource_id) return node.resource_id;
            if (node.vlm_label) return node.vlm_label;
            if (node.content_desc) return node.content_desc;
            return node.class_name.split('.').pop();
        }

        // 高亮元素
        function highlightElement(idx) {
            document.querySelectorAll('.ui-element').forEach(el => {
                el.classList.remove('highlight');

            document.querySelector(`.ui-element[data-index="${idx}"]`)?.classList.add('highlight');
        }

        // 开始探索（单包 或 Node 队列）
        async function startExploration() {
            const version = document.getElementById('explore-version').value;
            const packageName = document.getElementById('package-name').value.trim();
            const useQueueRun = version === 'node' && packageQueue.length > 0;

            if (!useQueueRun && !packageName) {
                alert(tr('mb.enter_package_name', 'Please enter app package name'));
                return;
            }
            if (runActive) {
                addLog('warn', tr('mb.task_already_running', 'A task is already running'));
                return;
            }

            const exploreMode = document.getElementById('explore-mode').value;
            const clickDelay = parseFloat(document.getElementById('click-delay').value) || 1.5;
            const baseConfig = {
                package: packageName,
                max_pages: parseInt(document.getElementById('max-pages').value),
                max_depth: parseInt(document.getElementById('max-depth').value),
                explore_mode: exploreMode,
                click_delay: clickDelay,
                vlm_concurrent_enabled: document.getElementById('vlm-concurrent-enabled').checked,
                vlm_concurrent_requests: parseInt(document.getElementById('vlm-concurrent-requests').value) || 5,
                vlm_occurrence_threshold: parseInt(document.getElementById('vlm-occurrence-threshold').value) || 2
            };

            allLogs = [];
            document.getElementById('logs').innerHTML = '';
            logIndex = 0;
            document.getElementById('progress-fill').style.width = '0%';

            activeRunMode = useQueueRun ? 'queue' : 'single';
            runActive = true;
            setRunUi(true, activeRunMode);
            renderQueueRuntime();
            startRealtimePolling();
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(pollLogs, 1000);

            if (useQueueRun) {
                const queuePayload = {
                    ...baseConfig,
                    packages: packageQueue.slice(),
                    retry_max: 2,
                    auto_save: true,
                    output_root: 'map_repo'
                };
                addLog('info', tr('mb.queue_start', '[node-queue] start, packages: {count}', { count: queuePayload.packages.length }));
                try {
                    const res = await fetch(`${API_BASE}/api/explore/node/queue/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(queuePayload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        addLog('info', data.message || tr('mb.queue_submitted', 'Queue submitted'));
                    } else {
                        addLog('error', data.message || tr('mb.queue_start_failed', 'Queue start failed'));
                        runActive = false;
                        activeRunMode = '';
                        stopRunPolling();
                        setRunUi(false);
                        renderQueueRuntime();

                    addLog('error', tr('mb.queue_start_failed_with_msg', 'Queue start failed: {msg}', { msg: e.message }));
                    runActive = false;
                    activeRunMode = '';
                    stopRunPolling();
                    setRunUi(false);
                    renderQueueRuntime();
                }
                return;
            }

            let apiUrl;
            if (version === 'node') {
                apiUrl = `${API_BASE}/api/explore/node/start`;
            } else if (version === 'coord') {
                apiUrl = `${API_BASE}/api/explore/coord/start`;
            } else if (version === 'som') {
                apiUrl = `${API_BASE}/api/explore/som/start`;
            } else if (version === 'v3') {
                apiUrl = `${API_BASE}/api/explore/v3/start`;
            } else {
                apiUrl = `${API_BASE}/api/explore/start`;
            }

            addLog('info', tr('mb.start_exploring', '[{version}] Start exploring: {pkg}', { version, pkg: packageName }));
            try {
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(baseConfig)
                });
                const data = await res.json();
                if (data.success) {
                    addLog('info', data.message || tr('mb.task_done', 'Task completed'));

                    addLog('error', data.message || tr('mb.task_failed', 'Task failed'));
                }
            } catch (e) {
                addLog('error', tr('mb.explore_failed', 'Exploration failed: {msg}', { msg: e.message }));

                runActive = false;
                activeRunMode = '';
                stopRunPolling();
                setRunUi(false);

        // 轮询日志 + 状态

            try {
                const res = await fetch(`${API_BASE}/api/explore/logs?since=${logIndex}`);
                const data = await res.json();

                if (data.success && data.logs.length > 0) {
                    data.logs.forEach(log => {

                    });
                    logIndex = data.total;
                }

                const statusRes = await fetch(`${API_BASE}/api/explore/status`);
                const status = await statusRes.json();
                const queueState = status.queue || {};
                renderQueueRuntime(queueState);

                if (status.progress) {
                    const pages = status.progress.pages_discovered || 0;
                    const maxPages = Math.max(1, parseInt(document.getElementById('max-pages').value) || 1);
                    const percent = Math.min(100, (pages / maxPages) * 100);
                    document.getElementById('progress-fill').style.width = `${percent}%`;
                }

                if (runActive && activeRunMode === 'queue' && !queueState.running) {
                    runActive = false;
                    activeRunMode = '';
                    stopRunPolling();
                    setRunUi(false);
                    const completed = Array.isArray(queueState.completed) ? queueState.completed.length : 0;
                    const failed = Array.isArray(queueState.failed) ? queueState.failed.length : 0;
                    addLog('info', tr('mb.queue_done', '[queue] done: success={completed}, failed={failed}', { completed, failed }));

        // 添加日志
        function setupLogFilters() {
            ['f-find', 'f-tap', 'f-warn', 'f-error', 'f-popup', 'f-route', 'f-vlm', 'f-other'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', renderLogs);
                }
            });
        }

        function classifyLog(level, message) {
            const m = String(message || '').toLowerCase();
            if (m.includes('[find_node]') || m.includes('find_node') || m.includes('query=')) return 'find';
            if (m.includes('[tap]') || m.includes('tap(') || m.includes('click')) return 'tap';
            if (m.includes('popup') || m.includes('block')) return 'popup';
            if (m.includes('path') || m.includes('queue') || m.includes('replay')) return 'route';
            if (m.includes('vlm') || m.includes('concurrent') || m.includes('infer')) return 'vlm';
            return 'other';
        }

        function shouldShowLog(entry) {
            const level = (entry.level || '').toLowerCase();
            if (level === 'warn' && !document.getElementById('f-warn')?.checked) return false;
            if (level === 'error' && !document.getElementById('f-error')?.checked) return false;
            if (level === 'warn' || level === 'error') return true;

            const cat = entry.category || 'other';
            if (cat === 'find' && !document.getElementById('f-find')?.checked) return false;
            if (cat === 'tap' && !document.getElementById('f-tap')?.checked) return false;
            if (cat === 'popup' && !document.getElementById('f-popup')?.checked) return false;
            if (cat === 'route' && !document.getElementById('f-route')?.checked) return false;
            if (cat === 'vlm' && !document.getElementById('f-vlm')?.checked) return false;
            if (cat === 'other' && !document.getElementById('f-other')?.checked) return false;

            return true;
        }

        function renderLogs() {
            const logsEl = document.getElementById('logs');
            const visible = allLogs.filter(shouldShowLog).slice(-800);
            logsEl.innerHTML = '';
            visible.forEach(log => {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<span class="log-time">${log.time}</span><span class="log-${log.level}">${log.message}</span>`;
                logsEl.appendChild(entry);
            });
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        function addLog(level, message, sourceTime = null) {
            const normalizedMessage = lt(String(message || ''));
            const entry = {
                level: (level || 'info').toLowerCase(),
                message: normalizedMessage,
                time: sourceTime || new Date().toLocaleTimeString(),
                category: classifyLog(level, normalizedMessage)
            };
            allLogs.push(entry);
            if (allLogs.length > LOG_MAX) {
                allLogs = allLogs.slice(-LOG_MAX);
            }
            renderLogs();
        }

        // 更新实时监控 UI (简化版)

                'running': `🟢 ${tr('mb.running', 'Running')}`,
                'paused': `🟡 ${tr('mb.paused', 'Paused')}`,
                'stopping': `🔴 ${tr('mb.stopping', 'Stopping')}`,
                'stopped': `⚫ ${tr('mb.stopped', 'Stopped')}`,

            };

            const stats = state.stats || {};

            // 更新状态栏

            const modeStr = state.mode === 'parallel' ? '⚡' : '';
            statusBadge.textContent = modeStr + (statusMap[state.status] || state.status);

            // 更新统计
            const explored = stats.explored_nodes || stats.pages || 0;
            const total = stats.total_nodes || '-';
            const actions = stats.total_actions || stats.actions || 0;
            const queue = stats.queue_size || 0;

                total,

            document.getElementById('explore-stats-inline').textContent = statsText;

            // 更新截图
            if (state.current_screenshot) {
                document.getElementById('screenshot-container').innerHTML = `

                         onclick="showFullScreenshot(this.src)">
                `;
            }

            // 更新当前动作
            const actionInfo = state.last_action || '-';
            document.getElementById('current-action-info').textContent = actionInfo;

            // 更新节点列表
            if (state.node_list && state.node_list.length > 0) {
                renderNodeListV5(state.node_list, 'node-list-container');

        // 渲染 v5 节点列表
        function renderNodeListV5(nodeList, containerId = 'node-list-container') {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (!nodeList || nodeList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 30px 15px;">
                        <div class="empty-state-icon" style="font-size: 36px;">📋</div>
                        <p style="font-size: 11px;">${tr('mb.no_nodes', 'No nodes')}</p>
                    </div>
                `;
                return;
            }

            const explored = nodeList.filter(n => n.explored);
            const pending = nodeList.filter(n => !n.explored);

            let html = '';

            // 统计信息
            html += `
                <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                    <div style="flex: 1; padding: 6px; background: rgba(0, 212, 170, 0.1); border-radius: 5px; text-align: center;">
                        <div style="font-size: 16px; font-weight: bold; color: #00d4aa;">${explored.length}</div>
                        <div style="font-size: 9px; color: #888;">${tr('mb.explored', 'Explored')}</div>
                    </div>
                    <div style="flex: 1; padding: 6px; background: rgba(255, 193, 7, 0.1); border-radius: 5px; text-align: center;">
                        <div style="font-size: 16px; font-weight: bold; color: #ffc107;">${pending.length}</div>
                        <div style="font-size: 9px; color: #888;">${tr('mb.pending', 'Pending')}</div>
                    </div>
                </div>
            `;

            // 待探索节点
            if (pending.length > 0) {
                html += `<div style="color: #ffc107; font-size: 10px; margin-bottom: 4px; font-weight: 500;">⏳ ${tr('mb.pending', 'Pending')}</div>`;
                pending.forEach((node, idx) => {
                    html += renderNodeItemV5(node, idx, false);
                });
            }

            // 已探索节点
            if (explored.length > 0) {
                html += `<div style="color: #00d4aa; font-size: 10px; margin: 8px 0 4px 0; font-weight: 500;">✓ ${tr('mb.explored', 'Explored')}</div>`;
                explored.forEach((node, idx) => {
                    html += renderNodeItemV5(node, idx, true);
                });
            }

            container.innerHTML = html;
        }

        // 渲染单个 v5 节点项
        function renderNodeItemV5(node, idx, explored) {
            const borderColor = explored ? '#00d4aa' : '#ffc107';
            const bgColor = explored ? 'rgba(0, 212, 170, 0.03)' : 'rgba(255, 193, 7, 0.03)';
            const statusIcon = explored ? '✓' : '○';

            const roleIcons = {
                'bottom_tab': '📱',
                'top_tab': '📑',
                'back': '⬅️',
                'jump': '🔗',
                'input': '✏️',
                'search': '🔍',
                'menu': '☰',
                'other': '•'
            };
            const roleIcon = roleIcons[node.role] || '•';

            return `
                <div style="padding: 6px 8px; margin-bottom: 4px; background: ${bgColor}; border-radius: 5px;
                            border-left: 2px solid ${borderColor};">
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 9px; color: ${borderColor};">${statusIcon}</span>
                        <span style="font-size: 11px;">${roleIcon}</span>
                        <span style="color: #ddd; font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${node.description || node.node_key || '?'}
                        </span>
                    </div>
                    ${node.target_description ? `
                        <div style="font-size: 9px; color: #7b68ee; margin-left: 24px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            → ${node.target_description}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 显示全屏截图
        function showFullScreenshot(src) {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.9); z-index: 9999;
                display: flex; align-items: center; justify-content: center;
                cursor: pointer;
            `;
            overlay.onclick = () => overlay.remove();

            const img = document.createElement('img');
            img.src = src;
            img.style.cssText = 'max-width: 90%; max-height: 90%; border-radius: 8px;';

            overlay.appendChild(img);
            document.body.appendChild(overlay);
        }

        // 开始实时监控轮询
        function startRealtimePolling() {
            if (realtimeInterval) return;
            realtimeInterval = setInterval(refreshRealtime, 2000);
        }

        // 停止实时监控轮询
        function stopRealtimePolling() {
            if (realtimeInterval) {
                clearInterval(realtimeInterval);
                realtimeInterval = null;
            }
        }

        // 刷新实时状态
        async function refreshRealtime() {
            try {
                const res = await fetch(`${API_BASE}/api/explore/realtime`);
                const data = await res.json();
                if (data.success) {
                    updateRealtimeUI(data.data);
                }
            } catch (e) {
                console.error('Realtime fetch error:', e);
            }
        }
    </script>
</body>
</html>
